{% extends "base.html" %}
{% block title %}500 — Error{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s7) var(--s5);">
  <div style="max-width:400px;">
    <div class="page-kicker">Error 500</div>
    <h1 class="page-title">Something went wrong</h1>
    <div class="page-title-rule"></div>
    <p style="color:var(--ink-2);margin-bottom:var(--s6);">{{ message or "An unexpected error occurred. Please try again or contact support." }}</p>
    <a href="/" class="btn btn-secondary">Go home</a>
  </div>
</div>
{% endblock %}
