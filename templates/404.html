{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s7) var(--s5);">
  <div style="max-width:400px;">
    <div class="page-kicker">Error 404</div>
    <h1 class="page-title">Not Found</h1>
    <div class="page-title-rule"></div>
    <p style="color:var(--ink-2);margin-bottom:var(--s6);">{{ message or "We could not find what you were looking for." }}</p>
    <a href="/" class="btn btn-secondary">Go back</a>
  </div>
</div>
{% endblock %}
